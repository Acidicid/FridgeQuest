product:
  type: kmp/lib
  platforms: [ jvm, android, wasmJs ]

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.kermit
  - $libs.multiplatform.settings.no.arg
  # Lab 5: Navigation 3 (KMP)
  - $libs.jetbrains.navigation3.ui
  - $libs.jetbrains.lifecycle.viewmodel.navigation3
  # Lab 5: Koin
  - $libs.koin.core
  - $libs.koin.compose
  - $libs.koin.compose.viewmodel

dependencies@android:
  - $compose.uiTooling
  # Lab 5: Navigation 3 (Android)
  - $libs.androidx.navigation3.runtime
  - $libs.androidx.navigation3.ui

settings:
  compose:
    enabled: true
    resources:
      packageName: org.example.project.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
